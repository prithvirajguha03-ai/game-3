<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 - Mind Game</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-6">
    <div class="w-full max-w-md mx-auto">
      <a href="#" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-indigo-600 transition-colors mb-6 group">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back to Games
      </a>

      <header class="mb-6">
        <div class="flex items-end justify-between mb-3">
          <div>
            <h1 class="text-6xl font-black bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">
              2048
            </h1>
            <p class="text-gray-500 text-sm mt-1 leading-relaxed">
              Combine matching numbers to reach 2048!
            </p>
          </div>
          <div class="flex gap-2">
            <div class="bg-white rounded-xl shadow-md px-4 py-3 text-center min-w-[72px] border border-gray-100">
              <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Score</p>
              <p id="score" class="text-2xl font-bold text-gray-800 leading-tight">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-md px-4 py-3 text-center min-w-[72px] border border-gray-100">
              <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Best</p>
              <p id="bestScore" class="text-2xl font-bold text-indigo-600 leading-tight">0</p>
            </div>
          </div>
        </div>

        <button id="newGameBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-indigo-500/20 hover:shadow-xl hover:shadow-indigo-500/30 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          New Game
        </button>
      </header>

      <div id="boardWrapper" class="relative bg-gray-200/80 backdrop-blur rounded-2xl p-3 shadow-xl shadow-gray-300/50 mb-6">
        <div id="board" class="relative grid grid-cols-4 gap-3 aspect-square w-full select-none">
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
          <div class="tile-cell rounded-lg bg-gray-300/60"></div>
        </div>

        <div id="overlay" class="hidden absolute inset-0 rounded-2xl bg-white/85 backdrop-blur-sm flex flex-col items-center justify-center z-20">
          <h2 id="overlayTitle" class="text-4xl font-black text-gray-800 mb-2"></h2>
          <p id="overlaySubtitle" class="text-gray-500 mb-6 text-center px-4"></p>
          <div class="flex gap-3">
            <button id="overlayNewGame" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all duration-150">
              New Game
            </button>
            <button id="overlayContinue" class="hidden bg-white text-gray-700 font-semibold py-3 px-6 rounded-xl shadow-md border border-gray-200 hover:bg-gray-50 active:scale-[0.98] transition-all duration-150">
              Keep Playing
            </button>
          </div>
        </div>
      </div>

      <div class="flex justify-center mb-6">
        <div class="grid grid-cols-3 gap-2 w-44">
          <div></div>
          <button data-dir="up" class="dir-btn bg-white hover:bg-indigo-50 text-gray-700 hover:text-indigo-600 shadow-md hover:shadow-lg active:scale-95 border border-gray-100 rounded-xl p-3.5 transition-all duration-150 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path>
            </svg>
          </button>
          <div></div>
          <button data-dir="left" class="dir-btn bg-white hover:bg-indigo-50 text-gray-700 hover:text-indigo-600 shadow-md hover:shadow-lg active:scale-95 border border-gray-100 rounded-xl p-3.5 transition-all duration-150 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>
          <button data-dir="down" class="dir-btn bg-white hover:bg-indigo-50 text-gray-700 hover:text-indigo-600 shadow-md hover:shadow-lg active:scale-95 border border-gray-100 rounded-xl p-3.5 transition-all duration-150 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <button data-dir="right" class="dir-btn bg-white hover:bg-indigo-50 text-gray-700 hover:text-indigo-600 shadow-md hover:shadow-lg active:scale-95 border border-gray-100 rounded-xl p-3.5 transition-all duration-150 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="text-center text-xs text-gray-400 leading-relaxed">
        <p>Use arrow keys or tap the buttons to move tiles.</p>
        <p class="mt-1">Match two same numbers to merge them.</p>
      </div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 4;
    const WIN_VALUE = 2048;

    let board = [];
    let score = 0;
    let bestScore = 0;
    let hasWon = false;
    let keepPlaying = false;
    let tileIdCounter = 0;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const newGameBtn = document.getElementById('newGameBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const overlayNewGame = document.getElementById('overlayNewGame');
    const overlayContinue = document.getElementById('overlayContinue');
    const dirBtns = document.querySelectorAll('.dir-btn');

    const tileColors = {
      2:    { bg: 'bg-white',           text: 'text-gray-700', shadow: 'shadow-sm' },
      4:    { bg: 'bg-amber-50',        text: 'text-gray-700', shadow: 'shadow-sm' },
      8:    { bg: 'bg-orange-200',      text: 'text-white',   shadow: 'shadow-md' },
      16:   { bg: 'bg-orange-300',      text: 'text-white',   shadow: 'shadow-md' },
      32:   { bg: 'bg-orange-400',      text: 'text-white',   shadow: 'shadow-md' },
      64:   { bg: 'bg-red-400',         text: 'text-white',   shadow: 'shadow-md' },
      128:  { bg: 'bg-yellow-300',      text: 'text-white',   shadow: 'shadow-lg' },
      256:  { bg: 'bg-yellow-400',      text: 'text-white',   shadow: 'shadow-lg' },
      512:  { bg: 'bg-yellow-500',      text: 'text-white',   shadow: 'shadow-lg' },
      1024: { bg: 'bg-indigo-500',      text: 'text-white',   shadow: 'shadow-xl' },
      2048: { bg: 'bg-gradient-to-br from-purple-500 to-pink-500', text: 'text-white', shadow: 'shadow-2xl shadow-purple-500/40' },
      4096: { bg: 'bg-gradient-to-br from-red-500 to-orange-500', text: 'text-white', shadow: 'shadow-2xl' },
      8192: { bg: 'bg-gradient-to-br from-emerald-500 to-teal-600', text: 'text-white', shadow: 'shadow-2xl' }
    };

    function getFontSize(value) {
      if (value < 100) return 'text-4xl';
      if (value < 1000) return 'text-3xl';
      if (value < 10000) return 'text-2xl';
      return 'text-xl';
    }

    function loadBestScore() {
      const saved = localStorage.getItem('2048-best-score');
      bestScore = saved ? parseInt(saved, 10) : 0;
      bestScoreEl.textContent = bestScore;
    }

    function saveBestScore() {
      localStorage.setItem('2048-best-score', bestScore.toString());
    }

    function initializeGame() {
      board = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        board.push(new Array(BOARD_SIZE).fill(null));
      }
      score = 0;
      hasWon = false;
      keepPlaying = false;
      updateScore();
      hideOverlay();
      removeAllTiles();
      addRandomTile();
      addRandomTile();
      renderBoard();
    }

    function createEmptyBoard() {
      const b = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        b.push(new Array(BOARD_SIZE).fill(null));
      }
      return b;
    }

    function getEmptyCells() {
      const cells = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (!board[r][c]) cells.push({ r, c });
        }
      }
      return cells;
    }

    function addRandomTile() {
      const empty = getEmptyCells();
      if (empty.length === 0) return null;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      const value = Math.random() < 0.9 ? 2 : 4;
      board[r][c] = { value, id: ++tileIdCounter, isNew: true, isMerged: false };
      return { r, c };
    }

    function removeAllTiles() {
      const tiles = boardEl.querySelectorAll('.tile');
      tiles.forEach(t => t.remove());
    }

    function renderBoard() {
      const existingTiles = new Map();
      boardEl.querySelectorAll('.tile').forEach(el => {
        const id = parseInt(el.dataset.id, 10);
        existingTiles.set(id, el);
      });

      const keepIds = new Set();

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const tile = board[r][c];
          if (!tile) continue;
          keepIds.add(tile.id);

          let el = existingTiles.get(tile.id);
          const style = tileColors[tile.value] || tileColors[8192];
          const fontSize = getFontSize(tile.value);

          const classes = [
            'tile',
            'absolute',
            'rounded-lg',
            'flex',
            'items-center',
            'justify-center',
            'font-bold',
            style.bg,
            style.text,
            style.shadow,
            fontSize,
            tile.isNew ? 'tile-appear' : '',
            tile.isMerged ? 'tile-pop' : ''
          ].filter(Boolean).join(' ');

          if (!el) {
            el = document.createElement('div');
            el.dataset.id = tile.id;
            boardEl.appendChild(el);
          }

          el.className = classes;
          el.textContent = tile.value;

          setTilePosition(el, r, c);

          if (tile.isNew) {
            el.addEventListener('animationend', () => {
              el.classList.remove('tile-appear');
            }, { once: true });
          }
          if (tile.isMerged) {
            el.addEventListener('animationend', () => {
              el.classList.remove('tile-pop');
            }, { once: true });
          }
        }
      }

      existingTiles.forEach((el, id) => {
        if (!keepIds.has(id)) {
          el.remove();
        }
      });

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c]) {
            board[r][c].isNew = false;
            board[r][c].isMerged = false;
          }
        }
      }
    }

    function setTilePosition(el, r, c) {
      const cellEls = boardEl.querySelectorAll('.tile-cell');
      const cellEl = cellEls[r * BOARD_SIZE + c];
      if (!cellEl) return;

      const parentRect = boardEl.getBoundingClientRect();
      const cellRect = cellEl.getBoundingClientRect();

      const left = cellRect.left - parentRect.left;
      const top = cellRect.top - parentRect.top;
      const width = cellRect.width;
      const height = cellRect.height;

      el.style.left = left + 'px';
      el.style.top = top + 'px';
      el.style.width = width + 'px';
      el.style.height = height + 'px';
      el.style.transition = 'left 120ms ease-out, top 120ms ease-out, transform 120ms ease-out';
    }

    function updateScore() {
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        saveBestScore();
      }
    }

    function cloneBoard() {
      return board.map(row =>
        row.map(cell => cell ? { ...cell } : null)
      );
    }

    function boardsEqual(a, b) {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const av = a[r][c] ? a[r][c].value : 0;
          const bv = b[r][c] ? b[r][c].value : 0;
          if (av !== bv) return false;
        }
      }
      return true;
    }

    function slideRowLeft(row) {
      const filtered = row.filter(Boolean);
      const result = [];
      let gained = 0;
      let i = 0;
      while (i < filtered.length) {
        if (i + 1 < filtered.length && filtered[i].value === filtered[i + 1].value) {
          const newVal = filtered[i].value * 2;
          const mergedTile = {
            value: newVal,
            id: ++tileIdCounter,
            isNew: false,
            isMerged: true
          };
          result.push(mergedTile);
          gained += newVal;
          i += 2;
        } else {
          result.push({ ...filtered[i], isMerged: false });
          i++;
        }
      }
      while (result.length < BOARD_SIZE) result.push(null);
      return { row: result, gained };
    }

    function move(direction) {
      const before = cloneBoard();
      let totalGained = 0;
      const newBoard = createEmptyBoard();

      if (direction === 'left') {
        for (let r = 0; r < BOARD_SIZE; r++) {
          const { row, gained } = slideRowLeft(board[r]);
          newBoard[r] = row;
          totalGained += gained;
        }
      } else if (direction === 'right') {
        for (let r = 0; r < BOARD_SIZE; r++) {
          const reversed = [...board[r]].reverse();
          const { row, gained } = slideRowLeft(reversed);
          newBoard[r] = row.reverse();
          totalGained += gained;
        }
      } else if (direction === 'up') {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const col = [];
          for (let r = 0; r < BOARD_SIZE; r++) col.push(board[r][c]);
          const { row, gained } = slideRowLeft(col);
          for (let r = 0; r < BOARD_SIZE; r++) newBoard[r][c] = row[r];
          totalGained += gained;
        }
      } else if (direction === 'down') {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const col = [];
          for (let r = BOARD_SIZE - 1; r >= 0; r--) col.push(board[r][c]);
          const { row, gained } = slideRowLeft(col);
          for (let r = 0; r < BOARD_SIZE; r++) newBoard[BOARD_SIZE - 1 - r][c] = row[r];
          totalGained += gained;
        }
      }

      if (boardsEqual(before, newBoard)) {
        if (checkGameOver()) {
          showOverlay('Game Over', 'No more moves possible. Try again!', false);
        }
        return false;
      }

      board = newBoard;
      score += totalGained;
      updateScore();
      renderBoard();

      setTimeout(() => {
        addRandomTile();
        renderBoard();

        if (!hasWon && !keepPlaying && checkWin()) {
          hasWon = true;
          showOverlay('You Win!', 'You reached 2048! Amazing work!', true);
          return;
        }

        if (checkGameOver()) {
          showOverlay('Game Over', 'No more moves possible. Try again!', false);
        }
      }, 130);

      return true;
    }

    function checkWin() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] && board[r][c].value >= WIN_VALUE) return true;
        }
      }
      return false;
    }

    function checkGameOver() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (!board[r][c]) return false;
        }
      }
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const v = board[r][c].value;
          if (r + 1 < BOARD_SIZE && board[r + 1][c] && board[r + 1][c].value === v) return false;
          if (c + 1 < BOARD_SIZE && board[r][c + 1] && board[r][c + 1].value === v) return false;
        }
      }
      return true;
    }

    function showOverlay(title, subtitle, canContinue) {
      overlayTitle.textContent = title;
      overlaySubtitle.textContent = subtitle;
      overlay.classList.remove('hidden');
      if (canContinue) {
        overlayContinue.classList.remove('hidden');
      } else {
        overlayContinue.classList.add('hidden');
      }
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function handleKeydown(e) {
      let dir = null;
      switch (e.key) {
        case 'ArrowUp':    dir = 'up'; break;
        case 'ArrowDown':  dir = 'down'; break;
        case 'ArrowLeft':  dir = 'left'; break;
        case 'ArrowRight': dir = 'right'; break;
      }
      if (dir) {
        e.preventDefault();
        if (overlay.classList.contains('hidden')) move(dir);
      }
    }

    function handleDirClick(e) {
      const btn = e.currentTarget;
      const dir = btn.dataset.dir;
      if (overlay.classList.contains('hidden')) move(dir);
    }

    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    function handleTouchStart(e) {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchMoved = false;
    }
    function handleTouchMove(e) {
      touchMoved = true;
    }
    function handleTouchEnd(e) {
      if (!touchMoved) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      const threshold = 24;
      if (Math.max(absX, absY) < threshold) return;
      if (overlay.classList.contains('hidden')) {
        if (absX > absY) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
      }
    }

    function handleResize() {
      renderBoard();
    }

    newGameBtn.addEventListener('click', initializeGame);
    overlayNewGame.addEventListener('click', initializeGame);
    overlayContinue.addEventListener('click', () => {
      keepPlaying = true;
      hideOverlay();
    });
    document.addEventListener('keydown', handleKeydown);
    dirBtns.forEach(btn => btn.addEventListener('click', handleDirClick));
    boardEl.addEventListener('touchstart', handleTouchStart, { passive: true });
    boardEl.addEventListener('touchmove', handleTouchMove, { passive: true });
    boardEl.addEventListener('touchend', handleTouchEnd, { passive: true });
    window.addEventListener('resize', handleResize);

    loadBestScore();
    initializeGame();
    window.addEventListener('load', renderBoard);
  </script>
</body>
</html>
